services:
  playwright-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-playwright:latest
    container_name: playwright-mcp-server
    stdin_open: true
    tty: true
    ports:
      # FIXED: Hardcoded host port to avoid podman-compose parsing bug.
      # (Alternatively, use an .env file so you don't need ':-' syntax here)
      - "8080:8080"
    environment:
      - MCP_PROXY_HOST=0.0.0.0
      # This line is fine because environment variables parse on '=' not ':'
      - MCP_PROXY_PORT=${MCP_PROXY_PORT:-8080}
      - MCP_PROXY_EXTRA_ARGS=${MCP_PROXY_EXTRA_ARGS:-}
      - PLAYWRIGHT_BROWSERS=${PLAYWRIGHT_BROWSERS:-chromium,firefox,webkit}
